version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # a release must be 3 days old before it is proposed: a yanked or hijacked version rarely survives that
    cooldown:
      default-days: 3
    groups:
      npm-all:
        patterns: ["*"]
    ignore:
      # the types follow the Node runtime (24, see engines and CI): no major bumps past it
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # vue-tsc, the Vue SFC compiler and the quality gates need the JS compiler API that TypeScript 7 drops
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions-all:
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      gradle-all:
        patterns: ["*"]
    ignore:
      # Gradle 9 needs an AGP 9 upgrade first; that is its own change
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]
