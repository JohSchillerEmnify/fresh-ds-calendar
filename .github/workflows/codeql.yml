name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      # private repo: CodeQL reads the workflow run, else the upload fails with "Resource not accessible by integration"
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: github/codeql-action/init@v4.39.1
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4.39.1
        with:
          category: /language:${{ matrix.language }}
