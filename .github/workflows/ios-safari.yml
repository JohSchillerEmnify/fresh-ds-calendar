name: iOS Safari

# Real iOS WebKit on a hosted Mac (free for public repos). Two independent jobs:
#  - playwright-webkit: the @iphone Playwright scenarios on macOS WebKit (much closer to Safari than Linux WebKit)
#  - safari-simulator: Mobile Safari in an iPhone simulator, driven by Appium with real touches (GitHub issue #9,
#    "Delete in a task list's ... menu does nothing on iPhone"); e2e/ios/run.mjs
# Not a required check: a run takes ~15 min of a hosted Mac, so it runs only nightly (the nightly workflow calls it
# through workflow_call, and only when main changed that day) or by hand: gh workflow run ios-safari.yml --ref <branch>
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Called from the nightly workflow every run gets its own group: the caller's name would collide with the caller's own group.
concurrency:
  group: ios-safari-${{ (github.event_name == 'push' || github.event_name == 'pull_request') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  playwright-webkit:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build:e2e
      # macOS needs no system packages: only the browser matching the locked @playwright/test version.
      - run: pnpm -F @calendar/e2e exec playwright install webkit
      - name: Run the @iphone scenarios on the iphone project
        env:
          E2E_BASE_URL: http://localhost:3000
        run: |
          # Same environment as e2e/run.sh: loopback only, mock provider, test endpoints on.
          HOST=127.0.0.1 PORT=3000 TEST_MODE=true PROVIDER=mock SEED=false DATA_DIR="$RUNNER_TEMP/data" \
            POLL_INTERVAL_MS=30000 TZ=Europe/Berlin NODE_ENV=production ALLOW_INSECURE_MOCK=1 \
            node --expose-gc server/dist/index.js > "$RUNNER_TEMP/server.log" 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          curl --retry 60 --retry-delay 1 --retry-connrefused -fsS "$E2E_BASE_URL/api/health"
          cd e2e
          pnpm exec bddgen
          pnpm exec playwright test --project=iphone --workers=1
      - name: Upload the report and results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-playwright-results
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/results.json
            ${{ runner.temp }}/server.log
          if-no-files-found: ignore

  safari-simulator:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      ARTIFACTS: ${{ github.workspace }}/e2e/ios/artifacts
      BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build:e2e
      # Appium and its iOS driver live in their own lockfile, outside the pnpm workspace.
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: e2e/ios
      - name: Start the TEST_MODE server
        run: |
          mkdir -p "$ARTIFACTS"
          # Same environment as e2e/run.sh: loopback only (the simulator shares the Mac's localhost), mock provider, test endpoints on.
          HOST=127.0.0.1 PORT=3000 TEST_MODE=true PROVIDER=mock SEED=false DATA_DIR="$RUNNER_TEMP/data" \
            POLL_INTERVAL_MS=30000 TZ=Europe/Berlin NODE_ENV=production ALLOW_INSECURE_MOCK=1 \
            nohup node --expose-gc server/dist/index.js > "$ARTIFACTS/server.log" 2>&1 &
          curl --retry 60 --retry-delay 1 --retry-connrefused -fsS "$BASE_URL/api/health"
      - name: Boot an iPhone simulator
        working-directory: e2e/ios
        run: |
          node pick-device.mjs | tee -a "$GITHUB_ENV"
          udid="$(node pick-device.mjs | sed -n 's/^UDID=//p')"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
      - name: Start Appium with the XCUITest driver
        working-directory: e2e/ios
        run: |
          # appium and the driver share this package.json, so Appium finds the driver without an install step
          npx appium driver list --installed
          # build WebDriverAgent up front: on a fresh runner it takes minutes, longer than a session request waits
          npx appium driver run xcuitest build-wda --sdk="$PLATFORM_VERSION" --name="$DEVICE_NAME"
          nohup npx appium --port 4723 --log-level info --log "$ARTIFACTS/appium.log" > /dev/null 2>&1 &
          curl --retry 60 --retry-delay 1 --retry-connrefused -fsS http://127.0.0.1:4723/status
      - name: Start the screen recording
        run: |
          nohup xcrun simctl io "$UDID" recordVideo --codec=h264 --force "$ARTIFACTS/safari.mp4" > /dev/null 2>&1 &
          echo $! > "$RUNNER_TEMP/video.pid"
      - name: Tap through the task list menus in Mobile Safari
        working-directory: e2e/ios
        run: node run.mjs
      - name: Stop the screen recording
        if: always()
        run: |
          kill -INT "$(cat "$RUNNER_TEMP/video.pid")" 2>/dev/null || true
          sleep 5
      - name: Upload screenshots, video and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-safari-simulator
          path: e2e/ios/artifacts
          if-no-files-found: ignore
