name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR makes the older run pointless; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the changelog gate needs the merge base; on a push to main it compares main with itself and passes
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # tsc + unit + i18n + steps + quality gates (arch, dedup, types, lint, comments, knip)
      - run: pnpm verify
      # Advisory only: a dev/transitive advisory must not fail CI.
      - run: pnpm audit --prod
        continue-on-error: true

  # The @smoke and @ci scenarios (mobile project) against a TEST_MODE server built from this commit.
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build:e2e
      # Browser matching the exact @playwright/test version locked for the e2e package.
      - run: pnpm -F @calendar/e2e exec playwright install --with-deps chromium
      - name: Run @smoke and @ci on the mobile project
        env:
          E2E_BASE_URL: http://localhost:3000
        run: |
          # Same environment as e2e/run.sh: loopback only, mock provider, test endpoints on.
          HOST=127.0.0.1 PORT=3000 TEST_MODE=true PROVIDER=mock SEED=false DATA_DIR="$RUNNER_TEMP/data" \
            POLL_INTERVAL_MS=30000 TZ=Europe/Berlin NODE_ENV=production ALLOW_INSECURE_MOCK=1 \
            node --expose-gc server/dist/index.js > "$RUNNER_TEMP/server.log" 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          curl --retry 60 --retry-delay 1 --retry-connrefused -fsS "$E2E_BASE_URL/api/health"
          cd e2e
          pnpm exec bddgen
          pnpm exec playwright test --project=mobile --grep "@smoke|@ci" --workers=1
      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-smoke-report
          path: |
            e2e/playwright-report
            e2e/test-results
            ${{ runner.temp }}/server.log
          if-no-files-found: ignore

  # JVM unit tests of the Android app (widgets, Robolectric); the debug build needs no server URL.
  android-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17 # the app's sourceCompatibility (android/build.gradle)
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0 # compileSdk in android/variables.gradle
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # Robolectric downloads its Android jars from Maven at test time; a cache keeps a flaky download from failing CI
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('android/app/build.gradle') }}
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Writes the Capacitor config and web assets into android/ (git-ignored).
      - run: pnpm exec cap sync android
      - run: ./gradlew testDebugUnitTest
        working-directory: android

  # Does the APK differ from what the last green run saw? Then the emulator job runs; otherwise it is skipped (which
  # "CI result" accepts), so a web-only change does not pay for two emulator boots.
  android-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.diff.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          native=true
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            # android/, the Capacitor config and plugins, the web app bundled into the APK, and this test's own wiring
            if [ -z "$(git diff --name-only "$BASE" "$HEAD_SHA" -- android capacitor.config.ts capacitor.config.json package.json pnpm-lock.yaml web shared \
              .github/workflows/android-emulator.yml scripts/android-emulator-smoke.sh)" ]; then native=false; fi
          fi
          echo "native=$native" >> "$GITHUB_OUTPUT"

  android-emulator:
    needs: android-changes
    if: needs.android-changes.outputs.native == 'true'
    uses: ./.github/workflows/android-emulator.yml

  # The repo is public: commit messages that name people (scripts/hooks/personal-terms) fail here too, also when the
  # local commit-msg hook did not run.
  commit-messages:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the new commit messages
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # a new branch has no "before": check just the head commit
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then BASE="$HEAD_SHA~1"; fi
          scripts/check-commit-messages.sh "$BASE..$HEAD_SHA"

  # The one required status check: green only when every job above succeeded or was skipped. It runs even when a job
  # failed or was cancelled, so a branch ruleset needs just this name and new jobs only have to be added to `needs`.
  ci-result:
    name: CI result
    if: always()
    needs: [verify, e2e-smoke, android-unit, android-emulator, commit-messages]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every needed job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
