# The calendar app on sauron. Lives in the repo (owner, 2026-10-14); `.env` (secrets) and `data/` (DATA_DIR) sit next
# to this file but are git-ignored. Deploy with scripts/deploy.sh (project name `calendar`).
services:
  calendar:
    build:
      context: ..
      dockerfile: Dockerfile
    image: calendar:latest
    container_name: calendar
    restart: unless-stopped
    mem_limit: 192m
    labels:
      - traefik.enable=true
      - traefik.http.routers.calendar.rule=Host(`cal.mordor.local`) || Host(`cal.mordor.lan`)
      - traefik.http.services.calendar.loadbalancer.server.port=3000
    volumes:
      - ./data:/data
      # heap snapshots (`docker kill -s USR2 calendar`) hold session tokens: a 0700 dir outside the repo, made by scripts/deploy.sh
      - ${CAL_DIAG_DIR:-${HOME}/.local/share/calendar-diag}:/diag
    env_file:
      - .env
    environment:
      TZ: Europe/Berlin
      PORT: 3000
      DATA_DIR: /data
      NODE_OPTIONS: --max-old-space-size=96 --heapsnapshot-signal=SIGUSR2 --diagnostic-dir=/diag
      # This is the LAN-only preview with demo data (mock provider, no sign-in). The fail-closed guard (M7) would
      # otherwise refuse to start a mock server under NODE_ENV=production; this says "yes, open mock on the LAN is intended".
      ALLOW_INSECURE_MOCK: "1"
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true
