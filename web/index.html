<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a73e8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#202124" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Calendar with embeddable task lists" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Calendar" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <script>
      // Apply the last theme before first paint (no color flash). Failures are harmless.
      try {
        var m = localStorage.getItem('cal.themeMode') || 'system';
        var d = m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
        var c = localStorage.getItem('cal.themeCss');
        if (c) { var s = document.createElement('style'); s.id = 'm3-dynamic-theme'; s.textContent = c; document.head.appendChild(s); }
        var a = JSON.parse(localStorage.getItem('cal.themeAttrs') || 'null'), r = document.documentElement;
        if (a) { r.setAttribute('data-theme-name', a.name); r.setAttribute('data-glow', a.glow); r.setAttribute('data-entries', a.entries); r.setAttribute('data-corners', a.corners); r.setAttribute('data-scene', a.scene); }
      } catch (e) {}
    </script>
    <title>Calendar</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
