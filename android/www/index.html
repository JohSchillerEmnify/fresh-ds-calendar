<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar</title>
<style>
  body { font: 16px system-ui, sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #faf9fe; color: #2f323a; }
  @media (prefers-color-scheme: dark) { body { background: #121318; color: #e3e2e9; } }
  main { width: 100%; max-width: 420px; padding: 24px; box-sizing: border-box; }
  h1 { font-size: 24px; margin: 0 0 20px; }
  a { display: block; margin-top: 12px; padding: 16px 20px; border-radius: 20px; background: #495f8b; color: #fff; text-decoration: none; }
  a.alt { background: transparent; color: inherit; border: 1px solid #afb1bc; }
  strong { display: block; font-size: 18px; }
  small { opacity: .85; }
</style>
</head>
<body>
<main>
  <h1 id="title">Which calendar?</h1>
  <a href="/__server/fresh"><strong>cal.example.org</strong><small id="fresh">Everywhere (internet), recommended</small></a>
  <a class="alt" href="/__server/mordor"><strong>cal.mordor.lan</strong><small id="mordor">Home network only</small></a>
</main>
<script>
  if ((navigator.language || '').startsWith('de')) {
    document.documentElement.lang = 'de';
    document.getElementById('title').textContent = 'Welcher Kalender?';
    document.getElementById('fresh').textContent = 'Überall (Internet), empfohlen';
    document.getElementById('mordor').textContent = 'Nur im Heimnetz';
  }
</script>
</body>
</html>
