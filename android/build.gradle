// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.5.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Capacitor's modules ask for Java 21; this machine builds with JDK 17 (their sources compile with it), so every
// Android module is pinned to 17. `cap sync` rewrites app/capacitor.build.gradle, hence the override lives here.
subprojects {
    afterEvaluate { p ->
        if (p.hasProperty('android')) {
            p.android.compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        // Kotlin plugins (e.g. @capacitor/filesystem) target 21 on their own; Gradle refuses a 17/21 mix in one module
        p.plugins.withId('org.jetbrains.kotlin.android') {
            p.kotlin.jvmToolchain(17)
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
